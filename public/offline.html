<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#087F78" />
    <title>لا يوجد اتصال — عيادات مستشفى الأطفال التخصصي</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f6f9fb; color: #163c3a; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 440px); padding: 32px; border: 1px solid #dce8e7; border-radius: 24px; background: white; text-align: center; box-shadow: 0 16px 48px #163c3a12; }
      img { width: 96px; height: 96px; object-fit: contain; margin-bottom: 12px; }
      h1 { margin: 0 0 12px; font-size: 1.35rem; }
      p { margin: 0 0 22px; color: #52666b; line-height: 1.8; }
      button, a { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 20px; border: 0; border-radius: 12px; background: #087f78; color: white; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa/icon-192.png" alt="شعار مستشفى الأطفال التخصصي" />
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>تعذر الاتصال بالموقع الآن. يرجى التحقق من الشبكة ثم إعادة المحاولة. لا يمكن إجراء الحجز أو عرض البيانات دون اتصال.</p>
      <button type="button" onclick="location.reload()">إعادة المحاولة</button>
    </main>
  </body>
</html>
