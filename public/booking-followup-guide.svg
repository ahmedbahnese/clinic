<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">طريقة الحجز والمتابعة</title>
  <desc id="desc">شرح متحرك من أربع خطوات: اختر العيادة، احجز الموعد، احصل على رقم الدور، تابع الحجز بالهاتف.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#06302f"/><stop offset="1" stop-color="#087f78"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".18"/></filter>
    <style>
      .card{fill:#fff;stroke:#b7dcd7;stroke-width:2}.title{font:700 22px Cairo,Arial,sans-serif;fill:#163c3a}.small{font:600 16px Cairo,Arial,sans-serif;fill:#5a6e85}.num{font:900 24px Cairo,Arial,sans-serif;fill:#087f78}.line{stroke:#9bd8d1;stroke-width:6;stroke-linecap:round;stroke-dasharray:18 14;animation:dash 2.2s linear infinite}.phone{fill:none;stroke:#087f78;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.pulse{animation:pulse 1.8s ease-in-out infinite;transform-origin:center}.step{animation:rise 4.8s ease-in-out infinite}.s2{animation-delay:1.2s}.s3{animation-delay:2.4s}.s4{animation-delay:3.6s}@keyframes dash{to{stroke-dashoffset:-64}}@keyframes pulse{0%,100%{opacity:.35;transform:scale(.86)}50%{opacity:1;transform:scale(1.08)}}@keyframes rise{0%,12%,100%{opacity:.45;transform:translateY(8px)}20%,72%{opacity:1;transform:translateY(0)}}
    </style>
  </defs>
  <rect width="1200" height="420" rx="34" fill="url(#bg)"/>
  <text x="600" y="48" text-anchor="middle" fill="#fff" font-family="Cairo,Arial,sans-serif" font-size="26" font-weight="900">من الحجز إلى متابعة حجزك</text>
  <path d="M260 210H940" class="line" opacity=".8"/>
  <g class="step s1" filter="url(#shadow)"><rect x="55" y="92" width="230" height="230" rx="26" class="card"/><circle cx="105" cy="140" r="28" fill="#e6f4f2"/><text x="105" y="149" text-anchor="middle" class="num">١</text><path d="M155 133h48v44h-48zM163 125h32M169 185h20" class="phone"/><text x="170" y="222" text-anchor="middle" class="title">اختر العيادة</text><text x="170" y="254" text-anchor="middle" class="small">والوقت المناسب</text></g>
  <g class="step s2" filter="url(#shadow)"><rect x="345" y="92" width="230" height="230" rx="26" class="card"/><circle cx="395" cy="140" r="28" fill="#e6f4f2"/><text x="395" y="149" text-anchor="middle" class="num">٢</text><path d="M430 130h42v48h-42zM438 120h26M438 145h25M438 160h16" class="phone"/><text x="460" y="222" text-anchor="middle" class="title">أكمل الحجز</text><text x="460" y="254" text-anchor="middle" class="small">بالاسم ورقم الهاتف</text></g>
  <g class="step s3" filter="url(#shadow)"><rect x="635" y="92" width="230" height="230" rx="26" class="card"/><circle cx="685" cy="140" r="28" fill="#e6f4f2"/><text x="685" y="149" text-anchor="middle" class="num">٣</text><path d="M719 126h50v52h-50zM729 140h30M729 153h24M729 166h18" class="phone"/><text x="750" y="222" text-anchor="middle" class="title">احصل على رقم الدور</text><text x="750" y="254" text-anchor="middle" class="small">واحتفظ بالتذكرة</text></g>
  <g class="step s4" filter="url(#shadow)"><rect x="925" y="92" width="220" height="230" rx="26" class="card"/><circle cx="975" cy="140" r="28" fill="#e6f4f2"/><text x="975" y="149" text-anchor="middle" class="num">٤</text><path d="M1008 124h48v58h-48zM1017 137h30M1017 151h30M1017 165h20" class="phone"/><circle cx="1054" cy="183" r="16" fill="#f3c64b" class="pulse"/><text x="1035" y="222" text-anchor="middle" class="title">تابع حجزك</text><text x="1035" y="254" text-anchor="middle" class="small">برقم الهاتف</text></g>
</svg>
