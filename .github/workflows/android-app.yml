name: Android APK and Google Play AAB

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-app.yml'
  workflow_dispatch:
    inputs:
      app_name:
        description: 'الاسم الظاهر في Android'
        required: true
        type: string
        default: 'عيادات مستشفى الأطفال التخصصي'
      version_code:
        description: 'رقم الإصدار المتزايد المطلوب في Google Play'
        required: true
        type: string
        default: '1'
      version_name:
        description: 'اسم الإصدار المعروض للمستخدمين'
        required: true
        type: string
        default: '1.0.0'

permissions:
  contents: read

jobs:
  build:
    name: Build Android packages
    runs-on: ubuntu-latest
    env:
      APP_NAME: ${{ inputs.app_name || 'عيادات مستشفى الأطفال التخصصي' }}
      VERSION_CODE: ${{ inputs.version_code || '1' }}
      VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew --no-daemon -PAPP_NAME="$APP_NAME" -PVERSION_CODE="$VERSION_CODE" -PVERSION_NAME="$VERSION_NAME" :app:assembleDebug

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: clinic-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Check release signing secrets
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release APK and AAB
        if: steps.signing.outputs.configured == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon -PAPP_NAME="$APP_NAME" -PVERSION_CODE="$VERSION_CODE" -PVERSION_NAME="$VERSION_NAME" :app:assembleRelease :app:bundleRelease

      - name: Upload signed APK and Play AAB
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: clinic-android-release-apk-and-aab
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
